[build]
  functions = "netlify/functions"
  publish = "."

# Sitemap и robots.txt должны отдаваться с правильным Content-Type, иначе GSC выдаёт "Couldn't fetch"
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"